services:
  db:
    image: postgres:17-alpine
    container_name: oor-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oor_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - oor_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oor_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oor_market_data: